<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Thomas &middot; Somewhere Still</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="thomas.css">
<style id="ss-critical">
html,body{background:#04192B;margin:0;}
</style>
</head>
<body>
<div id="ss-veil" aria-hidden="true"></div>

<script src="core.js"></script>
<script>
window.THOMAS_AUTOBOOT = false;
window.THOMAS_IMG_BASE = 'assets/img/';
window.THOMAS_SND_BASE = 'assets/audio/';
</script>
<script src="thomas.js"></script>
<script>
(function(){
  window.__backToSea = function(){
    Veil.drop('index.html#at=thomas', 900);
  };
  Veil.silentResume();
  function start(){
    Libs.ready([['THREE','assets/lib/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'],['p5','assets/lib/p5.min.js','https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js']], function(){
      Veil.lift();
      if (typeof window.initThomasThread === 'function') window.initThomasThread();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
